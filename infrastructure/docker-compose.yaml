services:
  postgis:
    image: postgis/postgis:19rc1-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geopulse}
      POSTGRES_USER: ${POSTGRES_USER:-geopulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geopulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: